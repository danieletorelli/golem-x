name: CI

on:
  push:
    tags: [ 'v*.*.*' ]
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            /usr/local/bin/golem-cli
            /usr/local/bin/golem
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-is
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-component
        run: cargo binstall --no-confirm cargo-component || true
      - name: Install protobuf
        uses: arduino/setup-protoc@v3
      - name: Install golem-cli
        run: |
          if ! command -v golem-cli &> /dev/null
          then
            curl -Ssf -L -o golem-cli https://github.com/golemcloud/golem/releases/latest/download/golem-cli-x86_64-unknown-linux-gnu &&
            chmod +x golem-cli &&
            sudo mv golem-cli /usr/local/bin/
          else echo "golem-cli is already installed"
          fi
      - name: Create golem profile
        run: golem-cli profile add -s golem --component-url=http://localhost:9881/
      - name: Compile
        run: |
          rustup target add wasm32-wasi
          golem-cli app -b release build
      - name: Test
        run: cargo test --all
      - name: Clippy
        run: cargo clippy -- -Dwarnings
      - name: Save components
        uses: actions/upload-artifact@v4
        with:
          path: target/golem-components/release/*.wasm
          name: components
      - name: Install golem
        run: |
          if ! command -v golem &> /dev/null
          then
            curl -Ssf -L -o golem https://github.com/golemcloud/golem/releases/latest/download/golem-x86_64-unknown-linux-gnu &&
            chmod +x golem &&
            sudo mv golem /usr/local/bin/
          else echo "golem is already installed"
          fi
      - name: Run golem
        run: golem start &
      - name: Load components
        run: SKIP_BUILD=1 ./update_components.sh
      - name: Functional tests
        run: |
          source ./api_calls.sh

          compare_json "$(get_profile daniele)"             '{"status":200,"user":{"username":"daniele","followers":[],"followings":[]}}'
          compare_json "$(get_profile john)"                '{"status":200,"user":{"username":"john","followers":[],"followings":[]}}'

          compare_json  "$(tweet daniele Ciao)"             '{"status":201,"tweet":{"content":"Ciao","timestamp":0}}'
          compare_json  "$(get_tweets daniele)"             '{"status":200,"tweets":[{"content":"Ciao","timestamp":0}]}'

          compare_json  "$(follow daniele john)"            '{"status":201,"followed":true}'
          compare_json  "$(get_profile daniele)"            '{"status":200,"user":{"username":"daniele","followers":[],"followings":["john"]}}'
          compare_json  "$(get_profile john)"               '{"status":200,"user":{"username":"john","followers":["daniele"],"followings":[]}}'
          
          compare_json  "$(tweet john Hello)"               '{"status":201,"tweet":{"content":"Hello","timestamp":0}}'
          compare_json  "$(tweet john Heeey)"               '{"status":201,"tweet":{"content":"Heeey","timestamp":0}}'
          compare_json  "$(get_timeline daniele)"           '{"status":200,"tweets":[{"author":"john","content":"Hello","timestamp":0},{"author":"john","content":"Heeey","timestamp":0}]}'
          
          compare_json  "$(follow bob daniele)"             '{"status":201,"followed":true}'
          compare_json  "$(follow bob john)"                '{"status":201,"followed":true}'
          compare_json  "$(get_profile bob)"                '{"status":200,"user":{"username":"john","followers":[],"followings":["daniele","john"]}}'
          compare_json  "$(get_timeline bob)"               '{"status":200,"tweets":[{"author":"daniele","content":"Ciao","timestamp":0},{"author":"john","content":"Hello","timestamp":0},{"author":"john","content":"Heeey","timestamp":0}]}'

          compare_json  "$(unfollow daniele john)"          '{"status":200,"unfollowed":true}'
          compare_json  "$(get_profile daniele)"            '{"status":200,"user":{"username":"daniele","followers":["bob"],"followings":[]}}'
          compare_json  "$(get_profile john)"               '{"status":200,"user":{"username":"john","followers":["bob"],"followings":[]}}'

          compare_json  "$(tweet bob Yo)"                   '{"status":201,"tweet":{"content":"Yo","timestamp":0}}'
          compare_json  "$(get_timeline daniele)"           '{"status":200,"tweets":[]}'

          compare_json  "$(unfollow bob daniele)"           '{"status":200,"unfollowed":true}'
          compare_json  "$(get_profile bob)"                '{"status":200,"user":{"username":"bob","followers":[],"followings":["john"]}}'
          compare_json  "$(get_profile daniele)"            '{"status":200,"user":{"username":"daniele","followers":[],"followings":[]}}'
          compare_json  "$(get_timeline bob)"               '{"status":200,"tweets":[{"author":"john","content":"Hello","timestamp":0}]}'