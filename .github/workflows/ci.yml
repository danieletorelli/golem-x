name: CI

on:
  push:
    tags: [ 'v*.*.*' ]
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      buildtools:
        description: 'Build Golem tools from source'
        type: boolean
        required: false
        default: false
      debugmode:
        description: 'Run tests in debug mode'
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: golem-tools-cache
        with:
          path: |
            /usr/local/bin/golem-cli
            /usr/local/bin/golem
          key: ${{ runner.os }}-golem-tools
      - name: Install Rust
        if: steps.golem-tools-cache.outputs.cache-hit != 'true' && github.event.inputs.buildtools == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install protobuf
        if: steps.golem-tools-cache.outputs.cache-hit != 'true' && github.event.inputs.buildtools == 'true'
        uses: arduino/setup-protoc@v3
      - name: Install golem-cli
        if: steps.golem-tools-cache.outputs.cache-hit != 'true'
        run: |
          if [[ "${{ github.event.inputs.buildtools }}" == "true" ]]
          then
            cargo install --git https://github.com/golemcloud/golem golem-cli &&
            sudo mv ~/.cargo/bin/golem-cli /usr/local/bin &&
            echo "golem-cli built from source"
          else
            curl -Ssf -L -o golem-cli https://github.com/golemcloud/golem/releases/latest/download/golem-cli-x86_64-unknown-linux-gnu &&
            chmod +x golem-cli &&
            sudo mv golem-cli /usr/local/bin/ &&
            echo "golem-cli installed from latest git release"
          fi
          if command -v golem-cli &> /dev/null
          then echo "Golem CLI version: $(golem-cli --version | cut -d ' ' -f 2)"
          else exit 1
          fi
      - name: Install golem
        if: steps.golem-tools-cache.outputs.cache-hit != 'true'
        run: |
          if [[ "${{ github.event.inputs.buildtools }}" == "true" ]]
          then
            cargo install --git https://github.com/golemcloud/golem golem &&
            sudo mv ~/.cargo/bin/golem /usr/local/bin &&
            echo "golem built from source"
          else
            curl -Ssf -L -o golem https://github.com/golemcloud/golem/releases/latest/download/golem-x86_64-unknown-linux-gnu &&
            chmod +x golem &&
            sudo mv golem /usr/local/bin/ &&
            echo "golem installed from latest git release"
          fi
          if command -v golem &> /dev/null
          then echo "Golem version: $(golem --version | cut -d ' ' -f 2)"
          else exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: setup-environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/bin/golem-cli
            /usr/local/bin/golem
          key: ${{ runner.os }}-golem-tools
          fail-on-cache-miss: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.22
      - name: Install cargo-component
        run: cargo binstall --no-confirm cargo-component || true
      - name: Create golem profile
        run: golem-cli profile add -s golem --component-url=http://localhost:9881/
      - name: Compile
        run: ./update_components.sh build
      - name: Test
        run: cargo test --all
      - name: Clippy
        run: cargo clippy -- -Dwarnings
      - name: Save components
        uses: actions/upload-artifact@v4
        with:
          path: target/golem-components/release/*.wasm
          name: components

  functional-tests:
    runs-on: ubuntu-latest
    needs: [ setup-environment, build ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/bin/golem-cli
            /usr/local/bin/golem
          key: ${{ runner.os }}-golem-tools
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          fail-on-cache-miss: true
      - name: Run golem
        run: golem start &
      - name: Create golem profile
        run: golem-cli profile add -s golem --component-url=http://localhost:9881/
      - name: Load components
        run: SKIP_BUILD=true ./update_components.sh
      - name: Functional tests
        run: DEBUG=${{ github.event.inputs.debugmode }} ./run_tests.sh
